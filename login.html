<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE OPS // ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="ambient-light">
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="login-card">
        <div class="header">
            <div class="icon-circle">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Enter your credentials to access Elite Ops</p>
        </div>

        <div id="error-msg"></div>

        <form id="auth-form">
            <div class="input-group">
                <input type="email" id="email" required autocomplete="off">
                <label>Email Address</label>
                <div class="input-highlight"></div>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" required>
                <label>Password</label>
                <div class="input-highlight"></div>
            </div>

            <button type="submit" class="btn" id="submit-btn">
                <span id="btn-text">Sign In</span>
                <div class="spinner" id="btn-loader"></div>
            </button>
        </form>

        <div class="footer">
            <p id="toggle-text">
                Don't have an account? <span id="toggle-mode">Create Account</span>
            </p>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
