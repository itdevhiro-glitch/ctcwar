<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Card - Clean Tier System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-world: #1a1510;
            --paper: #f0e6d2; /* Sedikit lebih terang biar bersih */
            --ink: #1a1510;
            --gold: #c5a059;
            --crimson: #9e1b1b;
        }

        body {
            background-color: var(--bg-world);
            background-image: repeating-linear-gradient(45deg, #241e18 25%, transparent 25%, transparent 75%, #241e18 75%, #241e18);
            background-size: 30px 30px;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            margin: 0;
            color: var(--paper);
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        /* --- INPUT FORM --- */
        .registration-desk {
            background: #221c16;
            border: 2px solid var(--gold);
            padding: 30px;
            width: 350px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            position: relative;
        }
        
        .registration-desk::before {
            content: "GUILD REGISTRY";
            position: absolute;
            top: -15px; left: 50%; transform: translateX(-50%);
            background: #221c16;
            padding: 0 15px;
            color: var(--gold);
            font-family: 'Cinzel Decorative', cursive;
            font-weight: 700;
            border: 1px solid var(--gold);
            font-size: 14px;
        }

        .input-group { margin-bottom: 12px; }
        
        label {
            display: block;
            color: var(--gold);
            font-size: 11px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #4a3b2a;
            color: var(--paper);
            font-family: 'Cinzel', serif;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        /* Upload Button Style */
        input[type="file"] { display: none; }
        .file-upload-label {
            display: block;
            width: 100%;
            padding: 10px;
            background: rgba(197, 160, 89, 0.15);
            border: 1px dashed var(--gold);
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            color: var(--gold);
            box-sizing: border-box;
            transition: 0.2s;
        }
        .file-upload-label:hover { background: rgba(197, 160, 89, 0.3); }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            cursor: pointer;
            font-family: 'Cinzel Decorative', cursive;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid var(--gold);
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-calc { background: var(--crimson); color: white; border-color: var(--crimson); }
        .btn-calc:hover { background: #b92b2b; }
        
        .btn-dl { background: var(--gold); color: #221c16; display: none; }
        .btn-dl:hover { background: #e0b86a; }

        /* --- GUILD CARD --- */
        .card-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #guild-card {
            width: 420px;
            min-height: 680px;
            background-color: var(--paper);
            /* Texture Kertas Kuno */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.12'/%3E%3C/svg%3E");
            color: var(--ink);
            position: relative;
            padding: 35px;
            box-sizing: border-box;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            border: 6px double var(--gold);
            display: flex;
            flex-direction: column;
        }

        /* Decorative Corners */
        .corner {
            position: absolute;
            width: 30px; height: 30px;
            border: 2px solid var(--gold);
            z-index: 10;
        }
        .tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
        .tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
        .bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }
        .br { bottom: 6px; right: 6px; border-left: none; border-top: none; }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 12px;
            margin-bottom: 25px;
        }
        .guild-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 26px;
            font-weight: 900;
            color: var(--ink);
            margin: 0;
            text-transform: uppercase;
            line-height: 1;
        }
        .sub-title { font-size: 10px; letter-spacing: 4px; color: #555; text-transform: uppercase; margin-top: 5px; }

        /* PROFILE SECTION */
        .profile-section {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .portrait-frame {
            width: 100px;
            height: 125px;
            border: 3px solid var(--gold);
            padding: 4px;
            background: #fff;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        
        .portrait-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background-color: #221c16;
        }

        .info-col {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .name-box h2 { 
            font-size: 24px; 
            margin: 0 0 8px 0; 
            font-weight: 700; 
            line-height: 1.1; 
            text-transform: uppercase; 
            color: var(--crimson);
            word-break: break-word;
        }
        
        .class-box { 
            font-size: 11px; 
            font-weight: bold; 
            background: var(--ink); 
            color: #fff; 
            padding: 4px 8px; 
            text-transform: uppercase; 
            display: inline-block;
            letter-spacing: 1px;
        }

        /* RANK STAMP */
        .rank-area {
            position: absolute;
            top: 200px;
            right: 20px;
            transform: rotate(-10deg);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }
        .stamp-circle {
            width: 130px; height: 130px;
            border: 6px solid #000;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel Decorative', cursive;
            mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='noise'><feTurbulence type='fractalNoise' baseFrequency='0.1' numOctaves='3'/></filter><rect width='100' height='100' filter='url(%23noise)' opacity='0.8'/></svg>");
        }
        .stamp-grade { font-size: 80px; font-weight: 900; line-height: 0.8; }
        .stamp-label { font-size: 14px; font-weight: bold; margin-top: 5px; text-transform: uppercase; }
        
        .score-val {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: var(--ink);
            margin-bottom: 20px;
            padding: 8px 0;
            background: rgba(0,0,0,0.04);
            border-top: 1px solid rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(0,0,0,0.2);
        }

        .stats-grid {
            display: grid;
            gap: 14px;
            position: relative;
            z-index: 2;
        }
        
        .stat-row { display: flex; align-items: center; gap: 10px; }
        .stat-label { width: 90px; font-size: 11px; font-weight: bold; color: #444; letter-spacing: 0.5px; }
        .stat-num { width: 55px; text-align: right; font-weight: bold; font-size: 14px; }
        
        .bar-bg {
            flex: 1;
            height: 10px;
            background: rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.2);
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.8s ease-out;
        }

        /* Tiered Colors for Stats */
        .fill-atk { background: #8a1c1c; } /* Merah */
        .fill-dmg { background: #c25e00; } /* Orange */
        .fill-crit { background: #d4af37; } /* Emas */
        .fill-def { background: #2f3640; } /* Besi */
        .fill-res { background: #27ae60; } /* Hijau */
        .fill-imm { background: #8e44ad; } /* Ungu */

        .footer {
            margin-top: auto;
            text-align: center;
            font-size: 9px;
            color: #777;
            font-style: italic;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .seal {
            width: 30px; height: 30px;
            background: var(--crimson);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(138, 28, 28, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.7);
            font-size: 16px;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="registration-desk">
            
            <div class="input-group">
                <label>Guild Name</label>
                <input type="text" id="inGuild" placeholder="e.g. Ainz Ooal Gown" maxlength="22">
            </div>

            <div class="input-group">
                <label>Portrait Photo</label>
                <label for="photoUpload" class="file-upload-label">
                    [ CLICK TO UPLOAD IMAGE ]
                </label>
                <input type="file" id="photoUpload" accept="image/*">
            </div>

            <div class="input-group">
                <label>Name</label>
                <input type="text" id="inName" placeholder="Adventurer Name" maxlength="12">
            </div>
            <div class="input-group">
                <label>Class / Job</label>
                <input type="text" id="inRole" placeholder="e.g. Shadow Hunter" maxlength="15">
            </div>

            <div style="display:flex; gap:10px;">
                <div class="input-group" style="flex:1">
                    <label>STR (ATK) Max 350</label>
                    <input type="number" id="inAtk" placeholder="0">
                </div>
                <div class="input-group" style="flex:1">
                    <label>DEF (ARMOR) Max 350</label>
                    <input type="number" id="inArmor" placeholder="0">
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <div class="input-group" style="flex:1">
                    <label>DMG BOOST (%)</label>
                    <input type="number" id="inDmg" placeholder="%">
                </div>
                <div class="input-group" style="flex:1">
                    <label>CRITICAL (%)</label>
                    <input type="number" id="inCrit" placeholder="%">
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <div class="input-group" style="flex:1">
                    <label>DMG RESIST (%)</label>
                    <input type="number" id="inReduc" placeholder="%">
                </div>
                <div class="input-group" style="flex:1">
                    <label>CRIT RESIST (%)</label>
                    <input type="number" id="inImmune" placeholder="%">
                </div>
            </div>

            <button class="btn-calc" onclick="evaluateStats()">EVALUATE POWER</button>
            <button class="btn-dl" id="btnDl" onclick="downloadCard()">DOWNLOAD JPG</button>
        </div>

        <div class="card-wrapper">
            <div id="guild-card">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>

                <div class="header">
                    <h1 class="guild-title" id="outGuild">ADVENTURER GUILD</h1>
                    <div class="sub-title">OFFICIAL STATUS REPORT</div>
                </div>

                <div class="profile-section">
                    <div class="portrait-frame">
                        <img id="outPhoto" class="portrait-img" src="https://via.placeholder.com/150x200/221c16/555?text=?" alt="Profile">
                    </div>
                    <div class="info-col">
                        <div class="name-box">
                            <h2 id="outName">UNKNOWN</h2>
                        </div>
                        <div class="class-box" id="outRole">NO CLASS</div>
                    </div>
                </div>

                <div class="rank-area">
                    <div class="stamp-circle" id="stampBox" style="border-color:transparent; color:transparent">
                        <div class="stamp-grade" id="outRankGrade"></div>
                        <div class="stamp-label" id="outRankLabel"></div>
                    </div>
                </div>

                <div class="score-val">
                    POWER RATING: <span id="outScore">0</span>
                </div>

                <div class="stats-grid">
                    <div class="stat-row">
                        <span class="stat-label">STRENGTH</span>
                        <div class="bar-bg"><div class="bar-fill fill-atk" id="barAtk"></div></div>
                        <span class="stat-num" id="valAtk">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">AMPLIFY</span>
                        <div class="bar-bg"><div class="bar-fill fill-dmg" id="barDmg"></div></div>
                        <span class="stat-num" id="valDmg">0%</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">PRECISION</span>
                        <div class="bar-bg"><div class="bar-fill fill-crit" id="barCrit"></div></div>
                        <span class="stat-num" id="valCrit">0%</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">DEFENSE</span>
                        <div class="bar-bg"><div class="bar-fill fill-def" id="barArmor"></div></div>
                        <span class="stat-num" id="valArmor">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">FORTITUDE</span>
                        <div class="bar-bg"><div class="bar-fill fill-res" id="barReduc"></div></div>
                        <span class="stat-num" id="valReduc">0%</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">WILLPOWER</span>
                        <div class="bar-bg"><div class="bar-fill fill-imm" id="barImmune"></div></div>
                        <span class="stat-num" id="valImmune">0%</span>
                    </div>
                </div>

                <div class="footer">
                    <div class="seal">♔</div>
                    <span>Evaluated by The Grand Master</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Upload Foto Script
        document.getElementById('photoUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('outPhoto').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function evaluateStats() {
            // Get Input
            let guild = document.getElementById('inGuild').value || "ADVENTURER GUILD";
            let name = document.getElementById('inName').value || "Unknown";
            let role = document.getElementById('inRole').value || "Villager";
            
            let atk = parseInt(document.getElementById('inAtk').value) || 0;
            let armor = parseInt(document.getElementById('inArmor').value) || 0;
            let dmg = parseInt(document.getElementById('inDmg').value) || 0;
            let crit = parseInt(document.getElementById('inCrit').value) || 0;
            let reduc = parseInt(document.getElementById('inReduc').value) || 0;
            let immune = parseInt(document.getElementById('inImmune').value) || 0;

            // --- LOGIKA HITUNGAN 10,000 POINT ---
            // Bobot disesuaikan agar max score pas 10,000
            let pAtk = (Math.min(atk, 350) / 350) * 1500;    // 15%
            let pArmor = (Math.min(armor, 350) / 350) * 1500; // 15%
            let pDmg = (Math.min(dmg, 200) / 200) * 2000;     // 20%
            let pCrit = (Math.min(crit, 100) / 100) * 2500;   // 25% (Paling penting)
            let pReduc = (Math.min(reduc, 80) / 80) * 1500;   // 15%
            let pImmune = (Math.min(immune, 80) / 80) * 1000; // 10%

            let totalScore = Math.floor(pAtk + pArmor + pDmg + pCrit + pReduc + pImmune);

            // --- TIER SYSTEM RAPI (Clean Tiers) ---
            let rank = "F";
            let label = "NOVICE";
            let color = "#7f8c8d"; // Grey

            if (totalScore >= 5000) { rank = "D"; label = "APPRENTICE"; color = "#8d6e63"; } // Brown
            if (totalScore >= 6000) { rank = "C"; label = "ADEPT"; color = "#27ae60"; } // Green
            if (totalScore >= 7000) { rank = "B"; label = "EXPERT"; color = "#2980b9"; } // Blue
            if (totalScore >= 8000) { rank = "A"; label = "MASTER"; color = "#8e44ad"; } // Purple (Target Pro)
            if (totalScore >= 9000) { rank = "S"; label = "HERO"; color = "#c0392b"; } // Red
            if (totalScore >= 9500) { rank = "SS"; label = "LEGEND"; color = "#d35400"; } // Orange/Rust
            if (totalScore >= 9800) { rank = "SSS"; label = "DEMI-GOD"; color = "#c5a059"; } // Gold

            // Update UI Text
            document.getElementById('outGuild').innerText = guild.toUpperCase();
            document.getElementById('outName').innerText = name;
            document.getElementById('outRole').innerText = role;
            document.getElementById('outScore').innerText = totalScore.toLocaleString();

            // Update Stamp Visuals
            const stampBox = document.getElementById('stampBox');
            const stampGrade = document.getElementById('outRankGrade');
            const stampLabel = document.getElementById('outRankLabel');

            stampGrade.innerText = rank;
            stampLabel.innerText = label;

            // Apply Color
            stampBox.style.borderColor = color;
            stampBox.style.color = color;
            stampBox.style.transform = `rotate(${Math.floor(Math.random() * 20) - 10}deg)`;

            // Helper for Bars
            function setBar(val, max, barId, textId, suffix="") {
                let pct = (val / max) * 100;
                if(pct > 100) pct = 100;
                document.getElementById(barId).style.width = pct + "%";
                document.getElementById(textId).innerText = val + suffix;
            }

            setBar(atk, 350, 'barAtk', 'valAtk');
            setBar(dmg, 200, 'barDmg', 'valDmg', '%');
            setBar(crit, 100, 'barCrit', 'valCrit', '%');
            setBar(armor, 350, 'barArmor', 'valArmor');
            setBar(reduc, 80, 'barReduc', 'valReduc', '%');
            setBar(immune, 80, 'barImmune', 'valImmune', '%');

            document.getElementById('btnDl').style.display = "block";
        }

        function downloadCard() {
            const card = document.getElementById('guild-card');
            html2canvas(card, {
                scale: 2,
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = `GuildCard-${document.getElementById('inName').value}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            });
        }
    </script>
</body>
</html>
