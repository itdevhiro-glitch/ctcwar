<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Kingdom Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;800&family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            /* Palette Kerajaan */
            --paper-bg: #fdfbf7;
            --paper-texture: #f4ecd8;
            --ink-main: #2c2c2c;
            --royal-gold: #c6a664;
            --royal-gold-dark: #8a733e;
            --royal-red: #800020; /* Burgundy */
            --royal-blue: #1a237e;
            --parchment-shadow: #d7cfc1;
        }

        body {
            background-color: #1a1a1a;
            /* Pattern Background Kayu Meja */
            background-image: repeating-linear-gradient(45deg, #1f1f1f 25%, transparent 25%, transparent 75%, #1f1f1f 75%, #1f1f1f),
                              repeating-linear-gradient(45deg, #1f1f1f 25%, #1a1a1a 25%, #1a1a1a 75%, #1f1f1f 75%, #1f1f1f);
            background-size: 20px 20px;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px;
            margin: 0;
            color: var(--ink-main);
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            justify-content: center;
            width: 100%;
            max-width: 1400px;
        }

        /* --- CONTROL PANEL (Buku Catatan Guild) --- */
        .control-panel {
            background: #fdfbf7;
            border: 8px solid var(--ink-main);
            outline: 2px solid var(--royal-gold);
            outline-offset: -5px;
            padding: 30px;
            width: 300px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.7);
            position: relative;
            height: fit-content;
        }
        
        /* Hiasan Sudut Panel */
        .control-panel::after {
            content: "✍";
            position: absolute;
            top: -25px; left: 50%; transform: translateX(-50%);
            font-size: 40px;
            background: #1a1a1a;
            border-radius: 50%;
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid var(--royal-gold);
            color: var(--royal-gold);
        }

        .panel-header {
            text-align: center;
            border-bottom: 2px solid var(--royal-gold);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        .panel-header h2 { margin: 0; font-family: 'Cinzel Decorative', cursive; font-size: 18px; color: var(--royal-red); }

        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 10px; font-weight: bold; color: var(--royal-gold-dark); margin-bottom: 4px; letter-spacing: 1px; }
        
        input[type="text"], input[type="number"] {
            width: 100%; padding: 8px;
            background: rgba(0,0,0,0.03);
            border: 1px solid #ccc; border-bottom: 2px solid var(--royal-gold);
            font-family: 'Sorts Mill Goudy', serif; font-size: 16px; font-weight: bold;
            box-sizing: border-box; color: var(--ink-main);
        }
        input:focus { outline: none; background: rgba(198, 166, 100, 0.1); }

        .file-upload-btn {
            display: block; width: 100%; padding: 10px;
            text-align: center; border: 2px dashed var(--royal-gold);
            background: transparent; color: var(--royal-gold-dark);
            cursor: pointer; font-size: 11px; font-weight: bold;
            transition: 0.2s;
        }
        .file-upload-btn:hover { background: rgba(198, 166, 100, 0.1); }

        .btn-main {
            width: 100%; padding: 12px; margin-top: 15px;
            background: var(--royal-red); color: #fff; border: none;
            font-family: 'Cinzel Decorative', cursive; font-size: 14px;
            cursor: pointer; border: 1px solid #5a0016;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
            transition: 0.2s;
        }
        .btn-main:hover { background: #5a0016; }

        .btn-dl { background: var(--royal-gold); color: #2e2e2e; display: none; margin-top: 10px; }
        .btn-dl:hover { background: #a68b54; }

        /* --- THE ROYAL CARD (Status Scroll/Parchment) --- */
        .card-wrapper { perspective: 1000px; }

        #royal-card {
            width: 800px; height: 500px;
            background-color: var(--paper-bg);
            /* Texture Kertas Tua yang Elegan */
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            display: flex;
            padding: 30px;
            box-sizing: border-box;
            /* Border Emas Mewah */
            border: 4px double var(--royal-gold);
            outline: 10px solid var(--ink-main);
            overflow: hidden;
        }

        /* Ornamen Sudut (Corner Flourish) */
        .corner-decor {
            position: absolute; width: 60px; height: 60px;
            border: 2px solid var(--royal-gold);
            z-index: 10;
        }
        .tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .tl::after { content:"⚜"; position:absolute; top:2px; left:2px; color:var(--royal-gold); font-size:24px; }
        
        .tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .tr::after { content:"⚜"; position:absolute; top:2px; right:2px; color:var(--royal-gold); font-size:24px; }
        
        .bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .bl::after { content:"⚜"; position:absolute; bottom:2px; left:2px; color:var(--royal-gold); font-size:24px; }
        
        .br { bottom: 15px; right: 15px; border-left: none; border-top: none; }
        .br::after { content:"⚜"; position:absolute; bottom:2px; right:2px; color:var(--royal-gold); font-size:24px; }

        /* Layout Kiri: Foto & Identitas */
        .left-col {
            width: 260px;
            border-right: 2px solid rgba(198, 166, 100, 0.4);
            padding-right: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
        }

        .portrait-frame {
            width: 180px; height: 230px;
            border: 6px solid var(--royal-gold-dark);
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
            padding: 4px;
            background: #fff;
            margin-bottom: 20px;
            position: relative;
        }
        /* Pita di atas foto */
        .portrait-frame::before {
            content: "OFFICIAL PORTRAIT";
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            background: var(--royal-red); color: #fff;
            font-size: 9px; padding: 2px 10px; font-weight: bold; letter-spacing: 1px;
            border: 1px solid var(--ink-main);
        }

        .portrait-img {
            width: 100%; height: 100%; object-fit: cover;
            filter: sepia(0.3) contrast(1.1); /* Efek agak vintage */
        }

        .identity-box { width: 100%; margin-top: auto; }
        .char-name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 26px; color: var(--ink-main);
            margin: 0; line-height: 1; border-bottom: 2px solid var(--royal-gold);
            padding-bottom: 5px; margin-bottom: 5px;
        }
        .char-class {
            font-family: 'Cinzel', serif; font-size: 12px;
            color: var(--royal-red); font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
        }

        .guild-seal {
            margin-top: 15px;
            border: 1px solid rgba(0,0,0,0.1); padding: 5px; width: 100%;
        }
        .guild-name { font-size: 11px; font-weight: bold; color: #555; }

        /* Layout Kanan: Stats & Grafik */
        .right-col {
            flex: 1;
            padding-left: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Judul Dokumen */
        .doc-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--royal-gold);
            margin-bottom: 15px; padding-bottom: 5px;
        }
        .doc-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 28px; font-weight: 700; color: var(--ink-main);
        }
        .doc-subtitle { font-size: 10px; color: #888; letter-spacing: 2px; text-transform: uppercase; }

        /* Container Grafik & List */
        .stats-area {
            display: flex; align-items: center; gap: 20px; flex: 1;
        }

        /* Radar Chart: Diubah agar terlihat seperti digambar tinta */
        .radar-wrap {
            position: relative;
            width: 220px; height: 220px;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle, rgba(198,166,100,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* Stat Bars (List) */
        .stats-list { flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .stat-row { display: flex; align-items: center; gap: 10px; }
        .stat-label { width: 40px; font-size: 11px; font-weight: bold; color: #555; }
        
        /* Bar Gaya Kerajaan */
        .bar-track {
            flex: 1; height: 8px; background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.2);
            position: relative;
        }
        .bar-fill {
            height: 100%;
            background-image: linear-gradient(90deg, var(--royal-gold), var(--royal-gold-dark));
            width: 0%;
            transition: width 1s;
            border-right: 2px solid var(--ink-main); /* Ujung tinta */
        }
        /* Custom Colors per Stat */
        .fill-str { background: #8e2b2b; }
        .fill-vit { background: #2c3e50; }
        .fill-int { background: #5e3375; }
        .fill-agi { background: #d4ac0d; }
        .fill-res { background: #27ae60; }
        .fill-luk { background: #7f8c8d; }

        .stat-val { width: 40px; text-align: right; font-weight: bold; font-family: 'Sorts Mill Goudy', serif; font-size: 14px; }

        /* Rank Stamp (Stempel Lilin) */
        .rank-stamp-area {
            position: absolute; bottom: 10px; right: 10px;
            transform: rotate(-15deg);
        }
        .wax-seal {
            width: 100px; height: 100px;
            background: radial-gradient(circle at 30% 30%, #e74c3c, #c0392b);
            border-radius: 50%;
            border: 4px solid #922b21;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.3), inset 2px 2px 5px rgba(255,255,255,0.2);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: rgba(255,255,255,0.9);
            font-family: 'Cinzel Decorative', cursive;
            text-shadow: 1px 1px 0 #7b241c;
        }
        .seal-rank { font-size: 48px; font-weight: 900; line-height: 0.8; }
        .seal-label { font-size: 10px; font-weight: bold; margin-top: 2px; }

        /* Total Power */
        .total-power {
            position: absolute; bottom: 0; left: 30px;
            font-family: 'Sorts Mill Goudy', serif;
            font-size: 14px; font-style: italic; color: #555;
        }
        .total-power strong { font-size: 20px; color: var(--royal-red); font-family: 'Cinzel'; }

    </style>
</head>
<body>

    <div class="container">
        <div class="control-panel">
            <div class="panel-header">
                <h2>Royal Registry</h2>
            </div>
            
            <div class="input-group">
                <label>Guild / Kingdom</label>
                <input type="text" id="inGuild" placeholder="e.g. Kingdom of Belzerg">
            </div>

            <div class="input-group">
                <label>Hero Name</label>
                <input type="text" id="inName" placeholder="e.g. Kazuma Satou">
            </div>
            
            <div class="input-group">
                <label>Class / Job</label>
                <input type="text" id="inRole" placeholder="e.g. Adventurer">
            </div>

            <div class="input-group">
                <label>Portrait (Upload)</label>
                <label for="photoUpload" class="file-upload-btn">Select Painting</label>
                <input type="file" id="photoUpload" accept="image/*" style="display:none">
            </div>

            <div style="display:flex; gap:5px; margin-top:10px;">
                <div class="input-group" style="flex:1"><label>STR (Power)</label><input type="number" id="inAtk" placeholder="Max 350"></div>
                <div class="input-group" style="flex:1"><label>VIT (Defense)</label><input type="number" id="inArmor" placeholder="Max 350"></div>
            </div>
            <div style="display:flex; gap:5px;">
                <div class="input-group" style="flex:1"><label>INT (Magic)</label><input type="number" id="inDmg" placeholder="Max 200%"></div>
                <div class="input-group" style="flex:1"><label>AGI (Speed)</label><input type="number" id="inCrit" placeholder="Max 100%"></div>
            </div>
            <div style="display:flex; gap:5px;">
                <div class="input-group" style="flex:1"><label>RES (Resist)</label><input type="number" id="inReduc" placeholder="Max 80%"></div>
                <div class="input-group" style="flex:1"><label>LUK (Luck)</label><input type="number" id="inImmune" placeholder="Max 80%"></div>
            </div>

            <button class="btn-main" onclick="updateCard()">Appraise Status</button>
            <button class="btn-main btn-dl" id="btnDl" onclick="downloadCard()">Save to Archive</button>
        </div>

        <div class="card-wrapper">
            <div id="royal-card">
                <div class="corner-decor tl"></div>
                <div class="corner-decor tr"></div>
                <div class="corner-decor bl"></div>
                <div class="corner-decor br"></div>

                <div class="left-col">
                    <div class="portrait-frame">
                        <img id="outPhoto" class="portrait-img" src="https://via.placeholder.com/150x200/e0e0e0/555?text=NO+IMAGE" alt="Hero">
                    </div>
                    <div class="identity-box">
                        <h2 class="char-name" id="outName">UNKNOWN</h2>
                        <div class="char-class" id="outRole">Commoner</div>
                    </div>
                    <div class="guild-seal">
                        <div class="guild-name">ALLEGIANCE</div>
                        <div style="font-weight:bold; color:var(--royal-blue); margin-top:2px;" id="outGuild">None</div>
                    </div>
                </div>

                <div class="right-col">
                    <div class="doc-header">
                        <div>
                            <div class="doc-title">STATUS APPRAISAL</div>
                            <div class="doc-subtitle">Official Kingdom Assessment</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:30px;">♔</div>
                        </div>
                    </div>

                    <div class="stats-area">
                        <div class="radar-wrap">
                            <canvas id="radarChart" width="220" height="220"></canvas>
                        </div>

                        <div class="stats-list">
                            <div class="stat-row">
                                <span class="stat-label">STR</span>
                                <div class="bar-track"><div class="bar-fill fill-str" id="barAtk"></div></div>
                                <span class="stat-val" id="txtAtk">0</span>
                            </div>
                             <div class="stat-row">
                                <span class="stat-label">VIT</span>
                                <div class="bar-track"><div class="bar-fill fill-vit" id="barArmor"></div></div>
                                <span class="stat-val" id="txtArmor">0</span>
                            </div>
                             <div class="stat-row">
                                <span class="stat-label">INT</span>
                                <div class="bar-track"><div class="bar-fill fill-int" id="barDmg"></div></div>
                                <span class="stat-val" id="txtDmg">0</span>
                            </div>
                             <div class="stat-row">
                                <span class="stat-label">AGI</span>
                                <div class="bar-track"><div class="bar-fill fill-agi" id="barCrit"></div></div>
                                <span class="stat-val" id="txtCrit">0</span>
                            </div>
                             <div class="stat-row">
                                <span class="stat-label">RES</span>
                                <div class="bar-track"><div class="bar-fill fill-res" id="barReduc"></div></div>
                                <span class="stat-val" id="txtReduc">0</span>
                            </div>
                             <div class="stat-row">
                                <span class="stat-label">LUK</span>
                                <div class="bar-track"><div class="bar-fill fill-luk" id="barImmune"></div></div>
                                <span class="stat-val" id="txtImmune">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="total-power">
                        Total Ability Score: <strong id="outScore">0</strong>
                    </div>

                    <div class="rank-stamp-area">
                        <div class="wax-seal">
                            <div class="seal-rank" id="outRankGrade">?</div>
                            <div class="seal-label" id="outRankLabel">UNRANKED</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- UPLOAD IMAGE ---
        document.getElementById('photoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('outPhoto').src = e.target.result;
                reader.readAsDataURL(file);
            }
        });

        // --- DRAW RADAR (Royal Style) ---
        function drawRadar(stats) {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = 70;

            ctx.clearRect(0, 0, w, h);

            const labels = ["STR", "INT", "LUK", "RES", "VIT", "AGI"];
            const data = [
                stats.atk / 350,
                stats.dmg / 200,
                stats.immune / 80,
                stats.reduc / 80,
                stats.armor / 350,
                stats.crit / 100
            ];
            const sides = 6;
            const angleStep = (Math.PI * 2) / sides;

            // Draw Web (Grid) - Warna Abu/Emas Pudar
            ctx.strokeStyle = "rgba(138, 115, 62, 0.3)";
            ctx.lineWidth = 1;
            for (let level = 1; level <= 4; level++) {
                ctx.beginPath();
                const r = (radius / 4) * level;
                for (let i = 0; i < sides; i++) {
                    const angle = i * angleStep - Math.PI / 2;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // Draw Spokes
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = i * angleStep - Math.PI / 2;
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
            }
            ctx.stroke();

            // Draw Stat Shape - Warna Tinta Sihir Ungu/Biru Gelap
            ctx.beginPath();
            ctx.fillStyle = "rgba(26, 35, 126, 0.4)"; // Royal Blue transparan
            ctx.strokeStyle = "#1a237e"; // Royal Blue solid
            ctx.lineWidth = 2;

            for (let i = 0; i < sides; i++) {
                const angle = i * angleStep - Math.PI / 2;
                let val = data[i]; if(val > 1) val = 1;
                const r = radius * val;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Labels Text - Font Serif
            ctx.fillStyle = "#8a733e";
            ctx.font = "bold 11px Cinzel";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for (let i = 0; i < sides; i++) {
                const angle = i * angleStep - Math.PI / 2;
                const r = radius + 20;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                ctx.fillText(labels[i], x, y);
            }
        }

        // --- UPDATE LOGIC ---
        function updateCard() {
            const guild = document.getElementById('inGuild').value || "Free Agent";
            const name = document.getElementById('inName').value || "Unknown Hero";
            const role = document.getElementById('inRole').value || "Villager";

            let atk = parseInt(document.getElementById('inAtk').value) || 0;
            let armor = parseInt(document.getElementById('inArmor').value) || 0;
            let dmg = parseInt(document.getElementById('inDmg').value) || 0;
            let crit = parseInt(document.getElementById('inCrit').value) || 0;
            let reduc = parseInt(document.getElementById('inReduc').value) || 0;
            let immune = parseInt(document.getElementById('inImmune').value) || 0;

            // Score Logic
            let pAtk = (Math.min(atk, 350) / 350) * 1500;
            let pArmor = (Math.min(armor, 350) / 350) * 1500;
            let pDmg = (Math.min(dmg, 200) / 200) * 2000;
            let pCrit = (Math.min(crit, 100) / 100) * 2500;
            let pReduc = (Math.min(reduc, 80) / 80) * 1500;
            let pImmune = (Math.min(immune, 80) / 80) * 1000;
            let totalScore = Math.floor(pAtk + pArmor + pDmg + pCrit + pReduc + pImmune);

            // Rank Logic
            let rank = "F", label = "Novice";
            if (totalScore >= 3000) { rank = "E"; label = "Rookie"; }
            if (totalScore >= 5000) { rank = "D"; label = "Regular"; }
            if (totalScore >= 6000) { rank = "C"; label = "Elite"; }
            if (totalScore >= 7000) { rank = "B"; label = "Knight"; }
            if (totalScore >= 8000) { rank = "A"; label = "Master"; }
            if (totalScore >= 9000) { rank = "S"; label = "Hero"; }
            if (totalScore >= 9500) { rank = "SS"; label = "Legend"; }

            // UI Text Update
            document.getElementById('outGuild').innerText = guild;
            document.getElementById('outName').innerText = name;
            document.getElementById('outRole').innerText = role;
            document.getElementById('outScore').innerText = totalScore.toLocaleString();
            document.getElementById('outRankGrade').innerText = rank;
            document.getElementById('outRankLabel').innerText = label;

            // Bars
            function setBar(val, max, idTxt, idBar, sfx="") {
                document.getElementById(idTxt).innerText = val + sfx;
                let pct = (val / max) * 100; if(pct>100) pct=100;
                document.getElementById(idBar).style.width = pct + "%";
            }
            setBar(atk, 350, 'txtAtk', 'barAtk');
            setBar(armor, 350, 'txtArmor', 'barArmor');
            setBar(dmg, 200, 'txtDmg', 'barDmg', '%');
            setBar(crit, 100, 'txtCrit', 'barCrit', '%');
            setBar(reduc, 80, 'txtReduc', 'barReduc', '%');
            setBar(immune, 80, 'txtImmune', 'barImmune', '%');

            drawRadar({atk, armor, dmg, crit, reduc, immune});
            document.getElementById('btnDl').style.display = "block";
        }

        function downloadCard() {
            const card = document.getElementById('royal-card');
            html2canvas(card, { scale: 2, backgroundColor:null }).then(canvas => {
                let link = document.createElement('a');
                link.download = `RoyalStatus-${document.getElementById('inName').value}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        }
    </script>
</body>
</html>
