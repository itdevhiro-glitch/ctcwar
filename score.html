<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahōteikoku Adventurer Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Share+Tech+Mono&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: rgba(20, 20, 23, 0.95);
            --gold: #d4af37;
        }

        body {
            background-color: var(--bg-dark);
            background-image: repeating-linear-gradient(45deg, #1a1a1a 0, #1a1a1a 1px, transparent 0, transparent 50%);
            background-size: 20px 20px;
            margin: 0; padding: 20px;
            font-family: 'Lato', sans-serif;
            color: #fff;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* --- CONTROL PANEL --- */
        .controls {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            padding: 20px; border-radius: 12px;
            width: 100%; max-width: 500px;
            margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls h2 { margin: 0 0 15px 0; color: var(--gold); font-family: 'Cinzel', serif; text-align: center; font-size: 18px; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .full-width { grid-column: span 2; }
        
        input {
            width: 100%; background: #222; border: 1px solid #444; color: #fff;
            padding: 8px; border-radius: 4px; box-sizing: border-box; font-family: 'Share Tech Mono', monospace;
        }
        input:focus { border-color: var(--gold); outline: none; }
        label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 3px; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px; cursor: pointer;
            font-weight: bold; font-family: 'Cinzel', serif; text-transform: uppercase; margin-top: 10px;
        }
        .btn-gen { background: var(--gold); color: #000; }
        .btn-gen:hover { background: #f1c40f; }
        .btn-dl { background: #fff; color: #000; display: none; }

        /* --- THE ADVENTURER CARD --- */
        .card-wrapper {
            perspective: 1000px; padding: 20px;
        }

        #adventurer-card {
            width: 600px; height: 350px; 
            position: relative;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            color: #fff;
            transition: 0.5s ease;
        }

        /* --- RANK SKINS --- */
        /* Rank F-E (Rustic) */
        .skin-iron {
            background: linear-gradient(135deg, #2c3e50, #4a5c6e);
            border: 4px solid #5d6d7e;
        }
        .skin-iron .card-accents { border-color: #5d6d7e; }

        /* Rank D-B (Silver) */
        .skin-silver {
            background: linear-gradient(135deg, #bdc3c7, #8e99a3);
            border: 4px solid #ecf0f1; color: #2c3e50;
        }
        .skin-silver .label-txt { color: #555 !important; }
        .skin-silver h1 { color: #2c3e50 !important; }

        /* Rank A (Gold - Elite) */
        .skin-gold {
            background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
            border: 4px solid #f1c40f;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
        }
        .skin-gold::before {
            content:''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle at 80% 20%, rgba(241, 196, 15, 0.2), transparent 50%);
        }
        .skin-gold .text-highlight { color: #f1c40f; }

        /* Rank S-SS (Platinum/Diamond) */
        .skin-platinum {
            background: linear-gradient(135deg, #1c2833, #34495e);
            border: 4px solid #aed6f1;
            box-shadow: 0 0 25px rgba(174, 214, 241, 0.5);
        }
        .skin-platinum .text-highlight { color: #aed6f1; text-shadow: 0 0 10px #3498db; }
        .skin-platinum::before {
            content:''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
        }

        /* Rank SSS (Mythical) */
        .skin-mythic {
            background: linear-gradient(135deg, #000000, #1a0b1a);
            border: 4px solid #a569bd; 
            box-shadow: 0 0 40px rgba(165, 105, 189, 0.8);
        }
        .skin-mythic::after {
            content:''; position: absolute; top:-50%; left:-50%; width:200%; height:200%;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='1' fill='white' opacity='0.5'/%3E%3C/svg%3E");
            animation: stars 20s linear infinite; opacity: 0.4;
        }
        .skin-mythic .text-highlight { color: #d2b4de; text-shadow: 0 0 15px #a569bd; }

        /* --- CARD LAYOUT --- */
        .card-bg-symbol {
            position: absolute; right: -50px; top: -50px;
            font-size: 350px; opacity: 0.1; color: currentColor;
            font-family: 'Cinzel Decorative', cursive; pointer-events: none;
        }

        .left-panel {
            width: 180px; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            border-right: 2px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2); z-index: 2;
        }

        .photo-frame {
            width: 120px; height: 120px;
            border-radius: 50%; border: 3px solid rgba(255,255,255,0.5);
            overflow: hidden; margin-bottom: 15px; background: #000;
        }
        .photo-img { width: 100%; height: 100%; object-fit: cover; }

        .magic-chip {
            width: 40px; height: 30px; background: linear-gradient(45deg, #d4af37, #f7dc6f);
            border-radius: 4px; margin-top: auto; position: relative;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.5), 1px 1px 2px rgba(0,0,0,0.5);
        }

        .right-panel {
            flex: 1; padding: 20px 30px; display: flex; flex-direction: column; z-index: 2;
        }

        .header-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 15px;
        }
        .kingdom-name { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .card-id { font-family: 'Share Tech Mono', monospace; font-size: 10px; opacity: 0.7; }

        .info-grid {
            display: grid; grid-template-columns: 2fr 1fr; gap: 15px;
        }

        .label-txt { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.6); margin-bottom: 2px; }
        .value-txt { font-size: 16px; font-weight: bold; margin-bottom: 10px; font-family: 'Lato', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .rank-display {
            display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
        }
        .rank-big {
            font-family: 'Cinzel', serif; font-size: 60px; line-height: 0.8; font-weight: 900;
        }
        .rank-label { font-size: 10px; text-transform: uppercase; letter-spacing: 3px; margin-top: 5px; }

        /* Stats Bar Mini */
        .stats-mini { margin-top: auto; display: flex; gap: 5px; }
        .stat-col { flex: 1; }
        .stat-bar { height: 4px; background: rgba(0,0,0,0.3); border-radius: 2px; margin-top: 2px; overflow: hidden; }
        .stat-fill { height: 100%; background: #fff; width: 50%; }

        .adventurer-seal {
            position: absolute; bottom: 15px; right: 20px;
            width: 80px; height: 80px; opacity: 0.8; mix-blend-mode: overlay;
            border: 2px solid currentColor; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center;
            transform: rotate(-20deg); font-family: 'Cinzel', serif; font-weight: bold;
        }

        @keyframes stars { from {background-position: 0 0;} to {background-position: 100px 100px;} }

    </style>
</head>
<body>

    <div class="controls">
        <h2>Server Stats Calculator</h2>
        <div class="input-grid">
            <div class="full-width"><label>Name</label><input type="text" id="inName" placeholder="Adventurer Name"></div>
            <div><label>Class</label><input type="text" id="inClass" placeholder="e.g. Swordsman"></div>
            <div><label>Guild</label><input type="text" id="inGuild" placeholder="e.g. Silver Wings"></div>
            <div class="full-width"><label>Photo</label><input type="file" id="inFile" accept="image/*" style="padding: 5px;"></div>
        </div>
        
        <div style="border-top: 1px solid #444; margin: 15px 0; padding-top: 10px; font-size: 12px; color: var(--gold); text-align: center;">
            INPUT SERVER RAW STATS
        </div>

        <div class="input-grid" style="grid-template-columns: repeat(2, 1fr); gap:10px;">
             <div><label>Attack Power (Max 315)</label><input type="number" id="sAtk" placeholder="0"></div>
            <div><label>Armor (Max 315)</label><input type="number" id="sDef" placeholder="0"></div>
            <div><label>Damage Bonus (Max 350)</label><input type="number" id="sDmg" placeholder="0"></div>
            <div><label>Crit Chance (Max 350)</label><input type="number" id="sCrt" placeholder="0"></div>
            <div><label>Dmg Reduction (Max 350)</label><input type="number" id="sRes" placeholder="0"></div>
            <div><label>Crit Immune (Max 350)</label><input type="number" id="sImm" placeholder="0"></div>
        </div>

        <button class="btn btn-gen" onclick="generateCard()">Calculate & Issue Card</button>
        <button class="btn btn-dl" id="btnDl" onclick="downloadCard()">Export Plate</button>
    </div>

    <div class="card-wrapper">
        <div id="cardScaler">
            <div id="adventurer-card" class="skin-iron">
                <div class="card-bg-symbol">⚜</div>
                
                <div class="left-panel">
                    <div class="photo-frame">
                        <img id="outPhoto" class="photo-img" src="https://via.placeholder.com/150/000000/FFFFFF?text=NO+IMG">
                    </div>
                    <div style="font-size: 9px; text-align: center; margin-top: 5px; opacity: 0.7;">
                        MAGIC CIRCUIT<br>AUTHORIZED
                    </div>
                    <div class="magic-chip"></div>
                </div>

                <div class="right-panel">
                    <div class="header-row">
                        <div class="kingdom-name text-highlight">Mahōteikoku</div>
                        <div class="card-id">ID: <span id="outId">000-000</span></div>
                    </div>

                    <div class="info-grid">
                        <div style="display: flex; flex-direction: column;">
                            <div>
                                <div class="label-txt">Adventurer Name</div>
                                <div class="value-txt text-highlight" style="font-size: 20px;" id="outName">UNKNOWN</div>
                            </div>
                            <div style="display: flex; gap: 15px;">
                                <div>
                                    <div class="label-txt">Class</div>
                                    <div class="value-txt" id="outClass">Novice</div>
                                </div>
                                <div>
                                    <div class="label-txt">Party / Guild</div>
                                    <div class="value-txt" id="outGuild">Freelancer</div>
                                </div>
                            </div>
                            
                            <div class="stats-mini">
                                <div class="stat-col"><div class="label-txt">OFFENSE</div><div class="stat-bar"><div class="stat-fill" id="barOff" style="width:10%"></div></div></div>
                                <div class="stat-col"><div class="label-txt">DEFENSE</div><div class="stat-bar"><div class="stat-fill" id="barDef" style="width:10%"></div></div></div>
                                <div class="stat-col"><div class="label-txt">TECHNIQUE</div><div class="stat-bar"><div class="stat-fill" id="barTec" style="width:10%"></div></div></div>
                            </div>
                        </div>

                        <div class="rank-display">
                            <div class="rank-big text-highlight" id="outRank">F</div>
                            <div class="rank-label" id="outRankTitle">ROOKIE</div>
                            <div style="margin-top: 10px; font-size: 10px; opacity: 0.6;">Power Rating</div>
                            <div style="font-family: 'Share Tech Mono'; font-size: 14px;" id="outScore">0000</div>
                        </div>
                    </div>

                    <div class="adventurer-seal">
                        OFFICIAL<br>GUILD<br>SEAL
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI SERVER BARU ---
        const MAX_ATK = 315; 
        const MAX_DEF = 315;
        const MAX_DMG = 350; 
        const MAX_CRT = 350;
        const MAX_RES = 350;  
        const MAX_IMM = 350;

        document.getElementById('inFile').addEventListener('change', function(e) {
            if(e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('outPhoto').src = e.target.result;
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        function generateCard() {
            // 1. Get Values
            const name = document.getElementById('inName').value || "Unknown";
            const job = document.getElementById('inClass').value || "Novice";
            const guild = document.getElementById('inGuild').value || "None";
            
            let atk = parseInt(document.getElementById('sAtk').value)||0;
            let def = parseInt(document.getElementById('sDef').value)||0;
            let dmg = parseInt(document.getElementById('sDmg').value)||0;
            let crt = parseInt(document.getElementById('sCrt').value)||0;
            let res = parseInt(document.getElementById('sRes').value)||0;
            let imm = parseInt(document.getElementById('sImm').value)||0;

            // 2. Score Calculation (Max Score = 12,000)
            // Menggunakan bobot 2000 per atribut
            let score = Math.floor(
                ((Math.min(atk,MAX_ATK)/MAX_ATK)*2000) +
                ((Math.min(def,MAX_DEF)/MAX_DEF)*2000) +
                ((Math.min(dmg,MAX_DMG)/MAX_DMG)*2000) +
                ((Math.min(crt,MAX_CRT)/MAX_CRT)*2000) +
                ((Math.min(res,MAX_RES)/MAX_RES)*2000) +
                ((Math.min(imm,MAX_IMM)/MAX_IMM)*2000)
            );

            // 3. Determine Rank Logic (Hard Mode)
            let rank = "F", title = "ROOKIE", skin = "skin-iron";
            
            // Logic Tier (Total Score 12000)
            // A = 7800 (65%) -> A sudah dianggap sangat bagus.
            // S = 9600 (80%) -> Lonjakan kesulitan.
            // SS = 10800 (90%) -> Sangat sulit.
            // SSS = 11950 (99.5%) -> Hampir perfect.

            if(score >= 3000) { rank="E"; title="SCOUT"; skin="skin-iron"; }
            if(score >= 4500) { rank="D"; title="VETERAN"; skin="skin-iron"; }
            if(score >= 6000) { rank="C"; title="COMMANDER"; skin="skin-silver"; }
            if(score >= 7200) { rank="B"; title="GENERAL"; skin="skin-silver"; }
            
            // Elite Ranks
            if(score >= 7800) { rank="A"; title="ROYAL GUARD"; skin="skin-gold"; } // 65% Capacity
            if(score >= 9600) { rank="S"; title="HERO"; skin="skin-platinum"; }    // 80% Capacity
            if(score >= 10800) { rank="SS"; title="DEMIGOD"; skin="skin-platinum"; } // 90% Capacity
            
            // Absolute Perfection
            if(score >= 11950) { rank="SSS"; title="LEGEND"; skin="skin-mythic"; }

            // 4. Update DOM
            document.getElementById('outName').innerText = name;
            document.getElementById('outClass').innerText = job;
            document.getElementById('outGuild').innerText = guild;
            document.getElementById('outScore').innerText = score;
            document.getElementById('outRank').innerText = rank;
            document.getElementById('outRankTitle').innerText = title;
            document.getElementById('outId').innerText = Math.floor(Math.random()*10000000);

            // 5. Update Visuals
            const card = document.getElementById('adventurer-card');
            card.className = ""; // Reset
            card.classList.add(skin);

            // 6. Visual Bars (Hanya estetik)
            // Offense: Atk + Dmg + Crit
            let offPct = ((atk/MAX_ATK) + (dmg/MAX_DMG) + (crt/MAX_CRT)) / 3 * 100;
            // Defense: Def + Res + Imm
            let defPct = ((def/MAX_DEF) + (res/MAX_RES) + (imm/MAX_IMM)) / 3 * 100;
            // Technique: Based on overall Score efficiency
            let tecPct = (score / 12000) * 100;

            document.getElementById('barOff').style.width = Math.min(offPct, 100) + "%";
            document.getElementById('barDef').style.width = Math.min(defPct, 100) + "%";
            document.getElementById('barTec').style.width = Math.min(tecPct, 100) + "%";

            document.getElementById('btnDl').style.display = "block";
        }

        function downloadCard() {
            const card = document.getElementById('adventurer-card');
            const scale = 2;
            html2canvas(card, {
                scale: scale,
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = `GuildCard_${document.getElementById('inName').value}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
